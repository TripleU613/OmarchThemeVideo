name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-video
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Every script parses
        run: for f in assets/scenes/*.js assets/lib/*.js assets/dev/*.js scripts/*.mjs; do node --check "$f"; done

      # The lyrics live in the repo; a checkout without them gets timed placeholder words.
      - name: Lyrics (placeholder only when missing)
        run: test -f assets/lib/lyrics.js || node scripts/build-lyrics.mjs --placeholder

      - name: Pages are assembled from the storyboard and in sync
        run: node scripts/assemble.mjs && git diff --exit-code -- index.html dev.html play.html STORYBOARD.md

      - name: Repo hygiene (no placeholders committed, no stray scenes, no big files)
        run: node scripts/verify.mjs

      # Static checks of the composition. The song lives in the repo; a checkout without it
      # gets a silent placeholder of the same length. HyperFrames is pinned to match local runs.
      - name: Placeholder audio (only when missing)
        run: node scripts/placeholder-audio.mjs

      - name: HyperFrames lint
        run: npx --yes hyperframes@0.8.166 lint
